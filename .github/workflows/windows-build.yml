name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock
      - name: Install build dependencies
        run: python -m pip install --requirement requirements-build.lock
      - name: Run synthetic tests
        run: python run_tests.py
      - name: Build and test the Windows executable
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          python build_windows.py --version "$releaseVersion" --output-dir dist
      - name: Upload ZIPs and checksums
        uses: actions/upload-artifact@v7
        with:
          name: OpenAutomation-Combined-windows-x64
          path: |
            dist/OpenAutomation-Combined-*-windows-x64.zip
            dist/OpenAutomation-Combined-*-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
